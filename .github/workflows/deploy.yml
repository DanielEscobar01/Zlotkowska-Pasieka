# Nombre del proceso de publicación en GitHub Actions.
# Nazwa procesu publikacji w GitHub Actions.
name: Deploy React app to GitHub Pages

# Ejecuta el despliegue cada vez que se suben cambios a main.
# Uruchamia wdrożenie po wysłaniu zmian do gałęzi main.
on:
  push:
    branches:
      - main

# Permisos para leer el repositorio y publicar el sitio en GitHub Pages.
# Uprawnienia do odczytu repozytorium i publikacji strony w GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Evita dos despliegues simultáneos; el nuevo cancela el anterior si sigue ejecutándose.
# Zapobiega równoległym wdrożeniom; nowe anuluje poprzednie, jeśli nadal trwa.
concurrency:
  group: pages
  cancel-in-progress: true

# Define el trabajo que compila y publica la aplicación.
# Definiuje zadanie budujące i publikujące aplikację.
jobs:
  deploy:

    # GitHub crea una máquina Ubuntu temporal para ejecutar estos pasos.
    # GitHub tworzy tymczasową maszynę Ubuntu do wykonania tych kroków.
    runs-on: ubuntu-latest

    steps:

      # Obtiene el commit que activó el workflow.
      # Pobiera commit, który uruchomił workflow.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Instala Node y reutiliza la caché npm para acelerar compilaciones futuras.
      # Instaluje Node i używa pamięci podręcznej npm, aby przyspieszyć kolejne kompilacje.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Instala las versiones exactas del lockfile para reproducir el entorno local.
      # Instaluje dokładne wersje z lockfile, aby odtworzyć środowisko lokalne.
      - name: Install dependencies
        run: npm ci

      # Vite incorpora estas variables públicas al bundle; GitHub las lee de las variables del repositorio.
      # Vite umieszcza te publiczne zmienne w bundle; GitHub pobiera je ze zmiennych repozytorium.
      - name: Build application
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_ADMIN_EMAIL: ${{ vars.VITE_SUPABASE_ADMIN_EMAIL }}
        run: npm run build

      # Prepara metadatos y permisos para publicar el artefacto en Pages.
      # Przygotowuje metadane i uprawnienia do publikacji artefaktu w Pages.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # Guarda dist como artefacto para que el paso de despliegue pueda publicarlo.
      # Zapisuje dist jako artefakt, który krok wdrożenia może opublikować.
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      # Publica la compilación; no ejecuta la app ni modifica la base de datos.
      # Publikuje kompilację; nie uruchamia aplikacji ani nie zmienia bazy danych.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
